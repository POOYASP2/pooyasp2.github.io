<header class="site-header">
  <a class="name" href="{{ "/" | relURL }}">{{ lower site.Title }}</a>
  <nav aria-label="Main">
    {{ $here := .RelPermalink }}
    {{ $isHome := .IsHome }}
    {{ range site.Menus.main }}
      {{ $url := .URL }}
      {{ $active := cond (eq $url "/") $isHome (hasPrefix $here $url) }}
      <a href="{{ $url }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a>
    {{ end }}
    <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme"><svg class="i-sun" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="i-moon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </nav>
  <script>
    (function () {
      var root = document.documentElement, btn = document.currentScript.parentNode.querySelector(".theme-toggle");
      var isDark = function () {
        var t = root.getAttribute("data-theme");
        return t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
      };
      var label = function () { btn.setAttribute("aria-label", isDark() ? "Switch to light theme" : "Switch to dark theme"); };
      btn.addEventListener("click", function () {
        var next = isDark() ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("theme", next); } catch (e) {}
        label();
      });
      label();
    })();
  </script>
</header>
